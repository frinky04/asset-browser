name: Release

# Pushes to master build too: tag runs can only restore caches saved on the default branch,
# so master keeps the dependency cache warm for the next release.
on:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' -List).Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Install toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Build
        run: ./dist.ps1

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create $env:GITHUB_REF_NAME "dist/asset-browser-$env:VERSION-windows-x64.zip" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
