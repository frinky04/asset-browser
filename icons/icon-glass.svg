<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Style 3: Dark glassy gradient tile with glowing cube -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12151F"/>
      <stop offset="1" stop-color="#1B2033"/>
    </linearGradient>
    <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DE3FF"/>
      <stop offset="1" stop-color="#4BA8FF"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5F8CFF"/>
      <stop offset="1" stop-color="#4653E8"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9B5CFF"/>
      <stop offset="1" stop-color="#6A34D9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#4BA8FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4BA8FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#glow)"/>
  <!-- perspective grid floor converging toward the cube -->
  <g stroke="#4A5A94" stroke-width="1.5" opacity="0.55">
    <path d="M44 204 L212 204 M58 190 L198 190 M70 178 L186 178 M80 168 L176 168"/>
    <path d="M128 168 V204 M104 168 L92 204 M80 168 L56 204 M152 168 L164 204 M176 168 L200 204"/>
  </g>
  <!-- glowing cube -->
  <g transform="translate(128,116)">
    <path d="M0,-52 L46,-26 L46,26 L0,52 L-46,26 L-46,-26 Z" fill="none" stroke="#7DE3FF" stroke-width="3" opacity="0.5"/>
    <path d="M0,-52 L46,-26 L0,0 L-46,-26 Z" fill="url(#cubeTop)"/>
    <path d="M-46,-26 L0,0 L0,52 L-46,26 Z" fill="url(#cubeLeft)"/>
    <path d="M46,-26 L0,0 L0,52 L46,26 Z" fill="url(#cubeRight)"/>
  </g>
  <!-- sparkle accents -->
  <g fill="#BFE9FF">
    <circle cx="70" cy="70" r="3"/>
    <circle cx="196" cy="88" r="2.2"/>
    <circle cx="184" cy="52" r="1.6"/>
  </g>
</svg>
